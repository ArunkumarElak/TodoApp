version: '3.8' 

services:
  backend:
    image:  mugeshtn07071999/todo_server:v1.0
    ports:
      - "5000:5000" 
    depends_on:
      - mongo  

  frontend:
    image: mugeshtn07071999/todo_client:v1.0 
    ports:
      - "5173:5173"
    depends_on:
      - backend 

  mongo:
    image: mongo:latest
    command: mongod --quiet
    ports:
      - "27017:27017"


