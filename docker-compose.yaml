services:
  backend:
    container_name: todo_server
    build: ./server                 
    image: mugeshtn07071999/todo_server:v1.0
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo  

  frontend:
    container_name: todo_client
    build: ./client                 
    image: mugeshtn07071999/todo_client:v1.0
    ports:
      - "5173:5173"
    depends_on:
      - backend 

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
